  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
      --reply-border: #dbeafe;
      --chip-bg: #eef2ff;
      --chip-text: #3730a3;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: var(--text); }
    body { background: var(--bg); }

    .app {
      display: grid;
      grid-template-rows: 64px 1fr;
      height: 100vh;
    }

    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 2;
    }

    .topbar .title { font-size: 18px; font-weight: 600; }
    .topbar .subtitle { color: var(--muted); font-size: 12px; }

    .content {
      height: 100%; overflow: hidden; display: grid; grid-template-rows: 1fr;
    }

    .scroll {
      overflow-y: auto; height: 100%; padding: 16px; scroll-behavior: smooth;
    }

    .day {
      margin: 16px 0; position: relative; text-align: center;
    }
    .day .line { border-top: 1px solid var(--border); }
    .day .label {
      position: relative; top: -12px; display: inline-block; padding: 2px 10px; background: var(--bg);
      color: var(--muted); font-size: 12px;
    }

    .message {
      display: grid; grid-template-columns: 40px 1fr; gap: 12px; padding: 12px; border-radius: 8px;
      background: var(--panel); border: 1px solid var(--border);
    }
    .message + .message { margin-top: 10px; }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #c7d2fe; color: #3730a3;
      display: grid; place-items: center; font-weight: 700;
    }

    .meta { display: flex; align-items: baseline; gap: 8px; }
    .name { font-weight: 600; }
    .time { color: var(--muted); font-size: 12px; }

    .body { margin-top: 6px; }
    .body :is(p, div) { margin: 0.3em 0; }

    .attachments { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .attachment { font-size: 12px; padding: 4px 8px; background: #ecfeff; color: #0e7490; border: 1px solid #bae6fd; border-radius: 999px; text-decoration: none; }

    .reactions { margin-top: 8px; display: flex; align-items: center; gap: 6px; }
    .chip { font-size: 12px; padding: 2px 6px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-text); border: 1px solid #c7d2fe; }

    .thread {
      margin-top: 10px; border-left: 3px solid var(--reply-border); padding-left: 10px; display: grid; gap: 8px;
    }

    .reply { background: #fafafa; border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: grid; grid-template-columns: 32px 1fr; gap: 10px; }
    .reply .avatar { width: 32px; height: 32px; font-size: 12px; }

    .footer-note { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0; }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Theme support and overrides */
    :root {
      --chip-border: #c7d2fe;
      --avatar-bg: #c7d2fe;
      --avatar-text: #3730a3;
      --attachment-bg: #ecfeff;
      --attachment-text: #0e7490;
      --attachment-border: #bae6fd;
      --reply-bg: #fafafa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --panel: #0f172a;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --border: #1f2a44;
        --reply-border: #1e293b;
        --chip-bg: #1e293b;
        --chip-text: #c7d2fe;
        --chip-border: #334155;
        --avatar-bg: #1e293b;
        --avatar-text: #c7d2fe;
        --attachment-bg: #0b2e36;
        --attachment-text: #7dd3fc;
        --attachment-border: #164e63;
        --reply-bg: #0b1526;
      }
    }

    :root[data-theme="dark"] {
      --bg: #0b1220;
      --panel: #0f172a;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --border: #1f2a44;
      --reply-border: #1e293b;
      --chip-bg: #1e293b;
      --chip-text: #c7d2fe;
      --chip-border: #334155;
      --avatar-bg: #1e293b;
      --avatar-text: #c7d2fe;
      --attachment-bg: #0b2e36;
      --attachment-text: #7dd3fc;
      --attachment-border: #164e63;
      --reply-bg: #0b1526;
    }

    /* Override specific components to use theme vars */
    .avatar { background: var(--avatar-bg); color: var(--avatar-text); }
    .attachment { background: var(--attachment-bg); color: var(--attachment-text); border-color: var(--attachment-border); }
    .chip { border-color: var(--chip-border); }
    .reply { background: var(--reply-bg); }
    .topbar .spacer { flex: 1; }
    .theme-btn { margin-left: auto; padding: 6px 10px; border-radius: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--border); cursor: pointer; font-size: 12px; }
    .theme-btn:hover { border-color: var(--accent); }
  </style>
</head>

  <script>
    // Theme handling: saved preference or system default
    (function initTheme() {
      const saved = localStorage.getItem('theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = (saved === 'dark' || saved === 'light') ? saved : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('theme-toggle');
      const setBtn = (t) => { if (btn) btn.textContent = t === 'dark' ? '☀️ Light' : '🌙 Dark'; };
      setBtn(theme);
      if (btn) {
        btn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
          const next = current === 'dark' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', next);
          localStorage.setItem('theme', next);
          setBtn(next);
        });
      }
    })();
    function initials(name) {
      if (!name) return '?';
      const parts = name.trim().split(/\s+/);
      const first = parts[0]?.[0] || '';
      const last = parts.length > 1 ? parts[parts.length - 1][0] : '';
      return (first + last).toUpperCase();
    }

    function formatDate(ts) {
      try { return new Date(ts).toLocaleString(); } catch { return ts; }
    }

    function groupByDate(messages) {
      const byDay = new Map();
      for (const m of messages) {
        const d = new Date(m.createdDateTime);
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        if (!byDay.has(key)) byDay.set(key, []);
        byDay.get(key).push(m);
      }
      return Array.from(byDay.entries()).sort(([a],[b]) => a.localeCompare(b));
    }

    function renderReactions(container, reactions) {
      if (!reactions || reactions.length === 0) return;
      const counts = reactions.reduce((acc, r) => {
        const key = r.reactionType || 'reaction';
        acc[key] = (acc[key] || 0) + 1;
        return acc;
      }, {});
      const block = document.createElement('div');
      block.className = 'reactions';
      for (const [type, count] of Object.entries(counts)) {
        const chip = document.createElement('span');
        const emoji = type === 'like' ? '👍' : (type === 'love' ? '❤️' : '🔖');
        chip.className = 'chip';
        chip.textContent = `${emoji} ${count}`;
        block.appendChild(chip);
      }
      container.appendChild(block);
    }

    function renderAttachments(container, attachments) {
      if (!attachments || attachments.length === 0) return;
      const wrap = document.createElement('div');
      wrap.className = 'attachments';
      for (const a of attachments) {
        const link = document.createElement('a');
        link.className = 'attachment';
        link.href = a.contentUrl || '#';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = a.name || 'Attachment';
        wrap.appendChild(link);
      }
      container.appendChild(wrap);
    }

    function renderBody(container, html, contentType) {
      const body = document.createElement('div');
      body.className = 'body';
      if (contentType === 'html') {
        body.innerHTML = html || '';
      } else {
        body.textContent = html || '';
      }
      container.appendChild(body);
    }

    function renderMessage(msg, isReply = false) {
      const el = document.createElement('div');
      el.className = isReply ? 'reply' : 'message';

      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = initials(msg?.from?.user?.displayName);

      const right = document.createElement('div');

      const meta = document.createElement('div');
      meta.className = 'meta';
      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = msg?.from?.user?.displayName || 'Unknown';
      const time = document.createElement('span');
      time.className = 'time';
      time.textContent = formatDate(msg.createdDateTime);
      meta.appendChild(name);
      meta.appendChild(time);
      right.appendChild(meta);

      renderBody(right, msg?.body?.content, msg?.body?.contentType);
      renderAttachments(right, msg?.attachments);
      renderReactions(right, msg?.reactions);

      el.appendChild(av);
      el.appendChild(right);

      // Replies
      if (!isReply && Array.isArray(msg.replies) && msg.replies.length) {
        const thread = document.createElement('div');
        thread.className = 'thread';
        for (const r of msg.replies) thread.appendChild(renderMessage(r, true));
        right.appendChild(thread);
      }

      return el;
    }

    function render() {
      const raw = document.getElementById('teams-data').textContent;
      let data = [];
      try { data = JSON.parse(raw); } catch (e) { console.error('Invalid JSON', e); }

      const list = document.getElementById('list');
      list.innerHTML = '';

      const days = groupByDate(data);
      for (const [day, items] of days) {
        // Day divider
        const dwrap = document.createElement('div');
        dwrap.className = 'day';
        const line = document.createElement('div'); line.className = 'line';
        const label = document.createElement('div'); label.className = 'label'; label.textContent = day;
        dwrap.appendChild(line); dwrap.appendChild(label);
        list.appendChild(dwrap);

        for (const msg of items) list.appendChild(renderMessage(msg));
      }

      // Scroll to top initially
      list.scrollTop = 0;

      // Footer note
      const footer = document.createElement('div');
      footer.className = 'footer-note';
      footer.textContent = 'Rendered locally • Teams-like view';
      list.appendChild(footer);
    }

    render();
  </script>
