<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams Conversation — Church Scenarios</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #0b1220;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --success: #34d399;
      --warn: #f59e0b;
      --danger: #f87171;
      --chip: #1f2937;
      --mark: #fde68a66;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica Neue, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .title { font-weight: 700; font-size: 20px; letter-spacing: 0.2px; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: var(--chip); border: 1px solid #243244; color: var(--muted); padding: 6px 10px; border-radius: 999px; font-size: 12px; }
    .panel { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid #1f2b3d; border-radius: 12px; padding: 16px; }
    .message { display: grid; grid-template-columns: 48px 1fr; gap: 12px; padding: 14px 12px; border-radius: 10px; transition: background 0.2s ease; }
    .message:hover { background: rgba(255,255,255,0.03); }
    .avatar { width: 48px; height: 48px; border-radius: 8px; display: grid; place-items: center; background: #223049; color: #aac8ff; font-weight: 700; }
    .meta { display: flex; align-items: baseline; gap: 8px; }
    .name { font-weight: 600; }
    .time { color: var(--muted); font-size: 12px; }
    .content { margin-top: 4px; line-height: 1.5; }
    .content mark { background: var(--mark); padding: 0 2px; border-radius: 3px; }
    .attachments, .reactions { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
    .attachment { font-size: 12px; padding: 4px 8px; background: #1b2536; border: 1px solid #243244; border-radius: 8px; }
    .reaction { font-size: 12px; padding: 4px 8px; background: #152033; border: 1px solid #243244; border-radius: 999px; color: #b3c1d1; }
    .replies { margin-left: 60px; border-left: 2px dashed #263347; padding-left: 16px; display: grid; gap: 8px; }
    .section { margin-top: 16px; border-top: 1px solid #1f2b3d; padding-top: 12px; }
    .badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; border: 1px solid #243244; background: #132037; color: #b7c6d8; }
    .badge.warn { color: #f6c76b; background: #2b220f; border-color: #3a2b12; }
    .badge.danger { color: #f6a9a9; background: #3b1212; border-color: #4a1717; }
    .empty { color: var(--muted); font-size: 14px; padding: 24px; text-align: center; }
    footer { color: var(--muted); font-size: 12px; margin-top: 16px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    select, input[type="search"] { background: #0f1626; border: 1px solid #233148; color: var(--text); border-radius: 8px; padding: 6px 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="title">Teams Conversation — Church Scenarios</div>
      <div class="controls">
        <input id="search" type="search" placeholder="Search text…" />
        <select id="scenario">
          <option value="">All scenarios</option>
          <option value="Support Escalation">Support Escalation</option>
          <option value="Strategic Review">Strategic Review</option>
          <option value="Competitive Inquiry">Competitive Inquiry</option>
          <option value="Feature Request">Feature Request</option>
        </select>
      </div>
    </header>

    <div class="legend">
      <span class="chip">Support Escalation → Identify Friction</span>
      <span class="chip">Strategic Review → Identify Value</span>
      <span class="chip">Competitive Inquiry → Early Warning</span>
      <span class="chip">Feature Request → Engagement</span>
    </div>

    <div class="panel section" id="root"></div>

    <footer>
      Rendered from data/input/teams_convo_church.json · Keywords highlighted in context
    </footer>
  </div>

  <script>
    const KEYWORDS = [
      // Support Escalation
      /\bthis is the third time\b/i,
      /\bstill not working\b/i,
      /\bblocker\b/i,
      /\burgent\b/i,
      // Strategic Review
      /\broi\b/i,
      /\boutcome[s]?\b/i,
      /\bbusiness goal[s]?\b/i,
      /\bnext steps\b/i,
      /\bbudgeting\b/i,
      // Competitive Inquiry
      /\bhow do you compare to\b/i,
      /\bcontract renewal terms\b/i,
      /\bdoes\s+[A-Za-z][\w\s-]*\s+have\b/i,
      // Feature Request
      /\bcan we also\b/i,
      /\bis it possible to\b/i,
      /\bintegration with\b/i,
    ];

    const SCENARIO_RULES = [
      { name: 'Support Escalation', any: [/third time/i, /still not working/i, /blocker/i, /urgent/i] },
      { name: 'Strategic Review', any: [/\broi\b/i, /business goal/i, /next steps/i, /budget/i, /outcome/i] },
      { name: 'Competitive Inquiry', any: [/how do you compare to/i, /contract renewal terms/i, /does .* have/i] },
      { name: 'Feature Request', any: [/can we also/i, /is it possible to/i, /integration with/i] },
    ];

    function scenarioFor(text) {
      for (const r of SCENARIO_RULES) {
        if (r.any.some(rx => rx.test(text))) return r.name;
      }
      return 'General';
    }

    function highlight(html) {
      let out = html;
      for (const rx of KEYWORDS) {
        out = out.replace(rx, m => `<mark>${m}</mark>`);
      }
      return out;
    }

    function initials(name) {
      return (name || '?')
        .split(/\s+/)
        .map(s => s[0])
        .filter(Boolean)
        .slice(0, 2)
        .join('')
        .toUpperCase();
    }

    function fmtTime(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    }

    function el(tag, className, html) {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (html !== undefined) e.innerHTML = html;
      return e;
    }

    function renderMessage(msg, isReply = false) {
      const wrapper = el('div', 'message');

      const name = msg?.from?.user?.displayName || 'Unknown';
      const time = msg?.createdDateTime || '';
      const html = msg?.body?.content || '';

      const av = el('div', 'avatar', initials(name));
      wrapper.appendChild(av);

      const right = el('div');
      const meta = el('div', 'meta');
      const nameEl = el('div', 'name', name);
      const timeEl = el('div', 'time', fmtTime(time));

      const badgeTxt = scenarioFor(html);
      const badge = el('span', 'badge' + (badgeTxt === 'Support Escalation' ? ' danger' : badgeTxt === 'Strategic Review' ? '' : badgeTxt === 'Competitive Inquiry' ? ' warn' : ''), badgeTxt);

      meta.appendChild(nameEl);
      meta.appendChild(badge);
      meta.appendChild(timeEl);

      const content = el('div', 'content');
      content.innerHTML = highlight(html);

      right.appendChild(meta);
      right.appendChild(content);

      const atts = Array.isArray(msg.attachments) ? msg.attachments : [];
      if (atts.length) {
        const attWrap = el('div', 'attachments');
        atts.forEach(a => {
          const t = el('span', 'attachment');
          const name = a?.name || a?.id || 'attachment';
          const url = a?.contentUrl;
          t.innerHTML = url ? `<a href="${url}" target="_blank" rel="noreferrer">${name}</a>` : name;
          attWrap.appendChild(t);
        });
        right.appendChild(attWrap);
      }

      const reacts = Array.isArray(msg.reactions) ? msg.reactions : [];
      if (reacts.length) {
        const rWrap = el('div', 'reactions');
        reacts.forEach(r => {
          const by = r?.user?.displayName ? ` · ${r.user.displayName}` : '';
          rWrap.appendChild(el('span', 'reaction', `${r.reactionType || 'react'}${by}`));
        });
        right.appendChild(rWrap);
      }

      // Replies
      const replies = Array.isArray(msg.replies) ? msg.replies : [];
      if (replies.length) {
        const replyWrap = el('div', 'replies');
        replies.forEach(rep => replyWrap.appendChild(renderMessage(rep, true)));
        right.appendChild(replyWrap);
      }

      wrapper.appendChild(right);
      return wrapper;
    }

    function applyFilters(root, data) {
      const q = document.getElementById('search').value.trim();
      const scen = document.getElementById('scenario').value;

      const normalize = (s) => s.toLowerCase();
      const matches = (msg) => {
        const html = msg?.body?.content || '';
        const scenName = scenarioFor(html);
        const textOk = !q || normalize(html).includes(normalize(q));
        const scenOk = !scen || scenName === scen;
        return textOk && scenOk;
      };

      root.innerHTML = '';
      let count = 0;
      data.forEach(m => {
        if (matches(m)) {
          root.appendChild(renderMessage(m));
          count++;
        }
      });

      if (!count) root.appendChild(el('div', 'empty', 'No messages match your filter.'));
    }

    async function main() {
      const root = document.getElementById('root');

      // Try to fetch JSON from file; if blocked (file:// CORS), fall back to embedded copy.
      let data = null;
      try {
        const res = await fetch('../input/teams_convo_church.json', { cache: 'no-store' });
        if (!res.ok) throw new Error('Fetch failed');
        data = await res.json();
      } catch (e) {
        try {
          data = JSON.parse(document.getElementById('embedded-json').textContent);
        } catch {}
      }

      if (!Array.isArray(data)) {
        root.innerHTML = '<div class="empty">Failed to load conversation data.</div>';
        return;
      }

      applyFilters(root, data);

      document.getElementById('search').addEventListener('input', () => applyFilters(root, data));
      document.getElementById('scenario').addEventListener('change', () => applyFilters(root, data));
    }

    document.addEventListener('DOMContentLoaded', main);
  </script>
